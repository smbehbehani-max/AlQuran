<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>البوابة</title>
<meta name="description" content="بوابة تنقلك إلى أطلس كربلاء أو إلى مرجع السادة البهبهانيين الكويتيين.">
<meta name="theme-color" content="#0e1322">
<script>
// روابط قديمة للأطلس فيها # تُحوَّل إليه مباشرة
if (location.hash && location.hash.length > 1) location.replace('atlas.html' + location.hash);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1322;--card:#151b2e;--line:#26304a;--text:#efe3c6;--muted:#a3abc0;--gold:#f3cf6e;--green:#4cc79f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;
 background:radial-gradient(ellipse at 50% 0%,#1d2550 0%,var(--bg) 60%)}
h1{font-family:"Reem Kufi",serif;font-weight:700;font-size:clamp(28px,6vw,44px);margin:0 0 8px;color:var(--gold);text-align:center}
.sub{font-family:Amiri,serif;color:var(--muted);font-size:18px;margin:0 0 36px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;width:100%;max-width:760px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;transition:transform .15s,border-color .15s,box-shadow .15s}
a.card:hover,a.card:focus-visible{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 30px -12px var(--accent);outline:none}
.icon{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);margin-bottom:16px}
.card h2{font-family:"Reem Kufi",serif;font-weight:500;font-size:24px;margin:0 0 8px;color:var(--accent)}
.card p{margin:0;color:var(--muted);line-height:1.8;font-size:15px}
.go{display:inline-block;margin-top:18px;font-weight:600;color:var(--accent)}
footer{margin-top:40px;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<h1>البوابة</h1>
<p class="sub">اختر وجهتك</p>
<div class="grid">
  <a class="card" href="atlas.html" style="--accent:var(--gold)">
    <div class="icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg></div>
    <h2>أطلس كربلاء</h2>
    <p>خلفيات واقعة كربلاء ومسير الإمام الحسين عليه السلام على الخريطة، مع الأنصار والمشاهد المقدّسة.</p>
    <span class="go">ادخل الأطلس ←</span>
  </a>
  <a class="card" href="https://smbehbehani-max.github.io/behbehani-family-tree/app/" style="--accent:var(--green)">
    <div class="icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2"/><circle cx="5" cy="19.5" r="2"/><circle cx="12" cy="19.5" r="2"/><circle cx="19" cy="19.5" r="2"/><path d="M12 6.5V17.5M12 12H5v5.5M12 12h7v5.5"/></svg></div>
    <h2>مشجرة السادة البهبهانيين</h2>
    <p>المرجع الرقمي لأنساب السادة البهبهانيين الكويتيين، مع البيوت والأعلام.</p>
    <span class="go">افتح المشجرة ←</span>
  </a>
</div>
<footer>إنتاج: د. سيد محمد مهدي بهبهاني</footer>
</body>
</html>
